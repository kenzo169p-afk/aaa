# =============================================================================
# Configuração Nginx de Produção para Hostinger VPS
# Suporta compressão Gzip, repasse de IP real (X-Forwarded-For) e links /p/<token>
# =============================================================================
upstream saas_contabil_backend {
    server saas-contabil-app:8090;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Compressão Gzip para máxima velocidade de carregamento (CSS/JS/JSON)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Headers de Segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy Reverso para o Servidor SaaS Contábil (API + SPA + Portal Público /p/<token>)
    location / {
        proxy_pass http://saas_contabil_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
